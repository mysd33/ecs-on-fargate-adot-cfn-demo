StartAt: ParallelJobs
States:
  ParallelJobs:
    Type: Parallel
    Branches:
      - StartAt: Job911
        States:
          Job911:
            Type: Task
            Resource: arn:aws:states:::batch:submitJob.sync
            Arguments:
              JobName: job911
              JobDefinition: ${job911_job_definition_arn}
              JobQueue: ${job_queue_arn}
              EcsPropertiesOverride:
                TaskProperties:
                  - Containers:
                      - Name: batch-jobflow
                        Command:
                          - --spring.batch.job.name=job911
                          - inputData=input911
                          - "{% 'executionId=' & $states.context.Execution.Input.executionId %}"
                        Environment:
                          - Name: TASK_TOKEN
                            Value: "{% $states.context.Task.Token %}"
            End: true
            Output:
              jobResult: "{% $states.result %}"
      - StartAt: Job912
        States:
          Job912:
            Type: Task
            Resource: arn:aws:states:::batch:submitJob.sync
            Arguments:
              JobName: job912
              JobDefinition: ${job912_job_definition_arn}
              JobQueue: ${job_queue_arn}
              EcsPropertiesOverride:
                TaskProperties:
                  - Containers:
                      - Name: batch-jobflow
                        Command:
                          - --spring.batch.job.name=job912
                          - inputData=input912
                          - "{% 'executionId=' & $states.context.Execution.Input.executionId %}"
                        Environment:
                          - Name: TASK_TOKEN
                            Value: "{% $states.context.Task.Token %}"
            End: true
            Output:
              jobResult: "{% $states.result %}"
    Next: Job913
    Output:
      jobResultList: "{% $states.result %}"
  Job913:
    Type: Task
    Resource: arn:aws:states:::batch:submitJob.sync
    Arguments:
      JobName: job913
      JobDefinition: ${job913_job_definition_arn}
      JobQueue: ${job_queue_arn}
      EcsPropertiesOverride:
        TaskProperties:
          - Containers:
              - Name: batch-jobflow
                Command:
                  - --spring.batch.job.name=job913
                  - "{% 'inputData=' & $string($states.input.jobResultList) %}"
                  - "{% 'executionId=' & $states.context.Execution.Input.executionId %}"
                Environment:
                  - Name: TASK_TOKEN
                    Value: "{% $states.context.Task.Token %}"
    End: true
    Output:
      jobResult: "{% $states.result %}"
QueryLanguage: JSONata
Comment: Parallel Jobflow Sample
