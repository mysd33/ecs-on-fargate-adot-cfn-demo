StartAt: Job921
States:
  Job921:
    Type: Task
    Resource: arn:aws:states:::batch:submitJob.sync
    Arguments:
      JobName: job921
      JobDefinition: ${job921_job_definition_arn}
      JobQueue: ${job_queue_arn}
      EcsPropertiesOverride:
        TaskProperties:
          - Containers:
              - Name: batch-jobflow
                Command:
                  - --spring.batch.job.name=job921
                  - inputData=input921
                  - "{% 'executionId=' &
                    $states.context.Execution.Input.executionId %}"
                Environment:
                  - Name: TASK_TOKEN
                    Value: "{% $states.context.Task.Token %}"
    Next: MapJobs
    Output:
      jobResult: "{% $states.result %}"
    Retry:
      - ErrorEquals:
          - Batch.ServerException
          - Batch.AWSBatchException
        BackoffRate: 2
        IntervalSeconds: 10
        MaxAttempts: 3
        JitterStrategy: FULL
  MapJobs:
    Type: Map
    Label: MapJobs
    Items: "{% $states.input.jobResult.list %}"
    MaxConcurrency: 50
    ItemProcessor:
      ProcessorConfig:
        Mode: DISTRIBUTED
        ExecutionType: STANDARD
      StartAt: Job922
      States:
        Job922:
          Type: Task
          Resource: arn:aws:states:::batch:submitJob.sync
          Arguments:
            JobName: job922
            JobDefinition: ${job922_job_definition_arn}
            JobQueue: ${job_queue_arn}
            EcsPropertiesOverride:
              TaskProperties:
                - Containers:
                    - Name: batch-jobflow
                      Command:
                        - --spring.batch.job.name=job922
                        - "{% 'inputData=' & $string($states.input) %}"
                        - "{% 'executionId=' &
                          $states.context.Execution.Input.executionId %}"
                      Environment:
                        - Name: TASK_TOKEN
                          Value: "{% $states.context.Task.Token %}"
          End: true
          Output:
            jobResult: "{% $states.result %}"
          Retry:
            - ErrorEquals:
                - Batch.ServerException
                - Batch.AWSBatchException
              BackoffRate: 2
              IntervalSeconds: 10
              MaxAttempts: 3
              JitterStrategy: FULL
    Next: Job923
    Output:
      jobResultList: "{% $states.result.jobResult %}"
  Job923:
    Type: Task
    Resource: arn:aws:states:::batch:submitJob.sync
    Arguments:
      JobName: job923
      JobDefinition: ${job923_job_definition_arn}
      JobQueue: ${job_queue_arn}
      EcsPropertiesOverride:
        TaskProperties:
          - Containers:
              - Name: batch-jobflow
                Command:
                  - --spring.batch.job.name=job923
                  - "{% 'inputData=' & $string($states.input.jobResultList) %}"
                  - "{% 'executionId=' &
                    $states.context.Execution.Input.executionId %}"
                Environment:
                  - Name: TASK_TOKEN
                    Value: "{% $states.context.Task.Token %}"
    End: true
    Output:
      jobResult: "{% $states.result %}"
    Retry:
      - ErrorEquals:
          - Batch.ServerException
          - Batch.AWSBatchException
        BackoffRate: 2
        IntervalSeconds: 10
        MaxAttempts: 3
        JitterStrategy: FULL
QueryLanguage: JSONata
Comment: Map Jobflow Sample
