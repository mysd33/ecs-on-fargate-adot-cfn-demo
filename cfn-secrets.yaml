AWSTemplateFormatVersion: 2010-09-09
Description: Secrets Manager Template for CloudFormation Demo. 
#Metadata: 

Parameters: 
  StackPrefix:
    Description: Stack Resource Name Prefix
    Type: String
    Default: Demo
  AuroraSecretsName:
    Description: Secrets Manager Name
    Type: String
    Default: /secrets/database-secrets
  AuroraDBUsername:
    NoEcho: 'true'
    Description: MasterUsername for Aurora PostgreSQL database access
    Type: String
    MinLength: '1'
    MaxLength: '16'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters.
  BasicAuthSecretsName:
    Description: Secrets Manager Name
    Type: String
    Default: /secrets/basicauth-secrets
  BasicAuthUsername:
    NoEcho: 'true'
    Description: Username for Basic Auth
    Type: String
    MinLength: '1'
    MaxLength: '16'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    Default: systemuser
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters.

#Mappings: 
#Conditions: 

Resources: 
# Secrets Manager
# https://docs.aws.amazon.com/ja_jp/secretsmanager/latest/userguide/reference_secret_json_structure.html#reference_secret_json_structure_rds
  RDSSecretsManager:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref AuroraSecretsName
      Description: RDS Aurora Secrets
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${AuroraDBUsername}"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: "\"@/\\"      
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-RDS-SecretsManager
  BasicAuthSecretsManager:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref BasicAuthSecretsName
      Description: Basic Auth Secrets
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${BasicAuthUsername}"}'
        GenerateStringKey: "password"
        PasswordLength: 16
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-BasicAuth-SecretsManager
Outputs:
  RDSSecretsManagerName:
    Description: RDS Secrets Manager Name
    Value: !Ref AuroraSecretsName
    Export: 
      Name: !Sub ${StackPrefix}-RDSSecretsManagerName
  RDSSecretsManagerArn:
    Description: RDS Secrets Manager Arn
    Value: !Ref RDSSecretsManager
    Export: 
      Name: !Sub ${StackPrefix}-RDSSecretsManagerArn
  BasicAuthSecretsManagerName:
    Description: Basic Auth Secrets Manager Name
    Value: !Ref BasicAuthSecretsName
    Export: 
      Name: !Sub ${StackPrefix}-BasicAuthSecretsManagerName
  BasicAuthSecretsManagerArn:
    Description: Basic Auth Secrets Manager Arn
    Value: !Ref BasicAuthSecretsManager
    Export: 
      Name: !Sub ${StackPrefix}-BasicAuthSecretsManagerArn